<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>RetainAI | Terminal (Vercel Edition)</title>
  <link rel="icon" type="image/x-icon" href="https://streamlit.io/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    body {
      margin: 0;
      background-color: #0E1217;
      color: #E6EAF0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background-color: #0E1217;
      color: #E6EAF0;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #263040;
      border-top: 3px solid #00A389;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .status {
      font-size: 13px;
      color: #8C98A8;
      max-width: 400px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: monospace;
      background: #1B232D;
      border: 1px solid #263040;
      border-radius: 3px;
      color: #00A389;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title">RetainAI: Institutional Terminal</div>
    <div class="status">Initializing WebAssembly Python kernel & loading 20,000 investor records on Vercel Edge...</div>
    <div class="badge">POWERED BY STLITE &bull; WASM RUNTIME</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    mount({
      entrypoint: "app/main.py",
      requirements: [
        "pandas",
        "numpy",
        "scikit-learn",
        "scipy",
        "plotly"
      ],
      files: {
        "app/main.py": { url: "./app/main.py" },
        "app/ui.py": { url: "./app/ui.py" },
        "app/data.py": { url: "./app/data.py" },
        "app/__init__.py": { url: "./app/__init__.py" },
        "app/views/__init__.py": { url: "./app/views/__init__.py" },
        "app/views/overview.py": { url: "./app/views/overview.py" },
        "app/views/risk_queue.py": { url: "./app/views/risk_queue.py" },
        "app/views/segments_playbook.py": { url: "./app/views/segments_playbook.py" },
        "app/views/experiment_planner.py": { url: "./app/views/experiment_planner.py" },
        "app/views/model_threshold.py": { url: "./app/views/model_threshold.py" },
        "src/__init__.py": { url: "./src/__init__.py" },
        "src/config.py": { url: "./src/config.py" },
        "src/economics.py": { url: "./src/economics.py" },
        "src/segments.py": { url: "./src/segments.py" },
        "src/stats.py": { url: "./src/stats.py" },
        "src/features.py": { url: "./src/features.py" },
        "sql/funnel.sql": { url: "./sql/funnel.sql" },
        "sql/retention.sql": { url: "./sql/retention.sql" },
        "sql/time_to_first_trade.sql": { url: "./sql/time_to_first_trade.sql" },
        "data/processed/scores.csv": { url: "./data/processed/scores.csv" },
        "data/processed/metrics.json": { url: "./data/processed/metrics.json" },
        "data/raw/retainai.db": { url: "./data/raw/retainai.db" },
        ".streamlit/config.toml": { url: "./.streamlit/config.toml" }
      }
    }, document.getElementById("root")).then(() => {
      const loader = document.getElementById("loading-container");
      if (loader) loader.style.display = "none";
    });
  </script>
</body>
</html>
